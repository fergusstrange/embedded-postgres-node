name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - id: upstream
        name: Read reviewed upstream pin
        run: node -e 'const p=require("./.github/upstream.json"); const fs=require("node:fs"); for(const [k,v] of Object.entries(p)) fs.appendFileSync(process.env.GITHUB_OUTPUT,`${k}=${v}\n`);'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          path: .local/upstream
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.upstream.outputs.goVersion }}
          cache: false
      - name: Install PostgreSQL runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl3 libreadline8 libxml2 libgssapi-krb5-2 zlib1g liblz4-1 libzstd1
      - run: npm ci
      - run: npm run test:coverage
      - name: Test installed package with published CLI and fresh PostgreSQL downloads
        run: npm run check:release
      - run: node scripts/prepare-integration.mjs .local/upstream
      - run: npm run test:integration
      - run: npm run test:examples
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
